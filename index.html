<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signature_styles.css">
    <script src="signature.js" defer></script>
</head>

<body>
    <div class="card">
        <img id="logo" src="" alt="Logo" style="max-width: 250px; display: none; margin: 0 auto 1rem auto;">

        <h1 id="title"></h1>
        
        <div class="description-section">
            <div class="asset-details" style="display: flex; flex-direction: column; margin-bottom: 1.5rem; font-size: 0.95rem; color: #555;">
                <signature-field id="displayAsset" name="asset" label="נכס:"></signature-field>
                <signature-field id="displayManufacturer" name="manufacturer" label="יצרן:"></signature-field>
                <signature-field id="displayModel" name="model" label="דגם:"></signature-field>
                <signature-field id="displayBarcode" name="barcode" label="ברקוד:"></signature-field>
                <signature-field id="displaySerialAlt" name="serialAlt" label="מספר סידורי:"></signature-field>
            </div>

            <p id="description"></p>
        </div>
      
        <div class="person-details" style="display: flex; flex-direction: column; margin-bottom: 1.5rem; font-size: 0.95rem; color: #555;">
            <signature-field id="displayCurrentUser" name="currentUser" label="פרטי המוסר:"></signature-field>
            <signature-field id="displayDestOwner" name="destOwner" label="פרטי המקבל:"></signature-field>
            <signature-field id="displayDate" name="date" label="תאריך:"></signature-field>
        </div> 

        <div class="signature-section">
            <label id="signatureLabel" style="display: block; font-weight: bold; margin-bottom: 0.5rem;">חתימת המקבל</label>
            <canvas id="canvas" width="400" height="200" style="border: 1px solid #ccc; background: #fff; max-width: 100%; box-sizing: border-box;"></canvas>
        </div>
        <br>

        <button id="clearBtn">ניקוי</button>
        <button id="approveBtn">אישור חתימה</button>
    </div>
</body>

</html>
